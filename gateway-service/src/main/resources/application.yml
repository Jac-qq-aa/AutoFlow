server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
    gateway:
      server:
        webflux:
          routes:
            - id: orders
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
            - id: inventory
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**
            - id: fulfillment
              uri: lb://fulfillment-service
              predicates:
                - Path=/api/fulfillment/**

autoflow:
  security:
    jwt-secret: ${JWT_SECRET:autoflow-demo-secret-change-me-32-bytes-minimum}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
