name: autoflow
x-app-env: &app-env
  DB_USERNAME: autoflow
  DB_PASSWORD: autoflow123
  REDIS_HOST: redis
  NACOS_SERVER_ADDR: nacos:8848
  ROCKETMQ_ENDPOINTS: broker:8081

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: root123
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.2.9-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nacos:
    image: nacos/nacos-server:v3.0.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: U2VjdXJlQXV0b0Zsb3dEZW1vVG9rVGhhdElzTG9uZ0Vub3VnaEZvck5hY29z
      NACOS_AUTH_IDENTITY_KEY: autoflow
      NACOS_AUTH_IDENTITY_VALUE: autoflow-demo
    ports: ["8848:8848", "8088:8080", "9848:9848", "9849:9849"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/v3/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  namesrv:
    image: apache/rocketmq:5.3.2
    command: sh mqnamesrv
    ports: ["9876:9876"]
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n localhost:9876 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  broker:
    image: apache/rocketmq:5.3.2
    command: sh mqbroker -n namesrv:9876 --enable-proxy
    environment:
      NAMESRV_ADDR: namesrv:9876
      JAVA_OPT_EXT: -Xms512m -Xmx512m -Xmn256m
    ports: ["8081:8081", "10911:10911"]
    depends_on:
      namesrv:
        condition: service_started

  rocketmq-init:
    image: apache/rocketmq:5.3.2
    entrypoint: ["sh", "-c"]
    command:
      - >-
        until sh mqadmin updateTopic -n namesrv:9876 -c DefaultCluster -t autoflow-order-events -a +message.type=FIFO; do sleep 2; done;
        sh mqadmin updateTopic -n namesrv:9876 -c DefaultCluster -t autoflow-inventory-events -a +message.type=FIFO;
        sh mqadmin updateTopic -n namesrv:9876 -c DefaultCluster -t autoflow-fulfillment-events -a +message.type=FIFO
    depends_on:
      broker:
        condition: service_started

  order-service:
    build: { context: ., dockerfile: order-service/Dockerfile }
    environment:
      <<: *app-env
      ORDER_DB_URL: jdbc:mysql://mysql:3306/autoflow_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    ports: ["8082:8082"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }
      rocketmq-init: { condition: service_completed_successfully }

  inventory-service:
    build: { context: ., dockerfile: inventory-service/Dockerfile }
    environment:
      <<: *app-env
      INVENTORY_DB_URL: jdbc:mysql://mysql:3306/autoflow_inventory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    ports: ["8083:8083"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }
      rocketmq-init: { condition: service_completed_successfully }

  fulfillment-service:
    build: { context: ., dockerfile: fulfillment-service/Dockerfile }
    environment:
      <<: *app-env
      FULFILLMENT_DB_URL: jdbc:mysql://mysql:3306/autoflow_fulfillment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    ports: ["8084:8084"]
    depends_on:
      mysql: { condition: service_healthy }
      nacos: { condition: service_healthy }
      rocketmq-init: { condition: service_completed_successfully }

  gateway-service:
    build: { context: ., dockerfile: gateway-service/Dockerfile }
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      JWT_SECRET: autoflow-demo-secret-change-before-production-use
    ports: ["8080:8080"]
    depends_on:
      nacos: { condition: service_healthy }
      order-service: { condition: service_started }
      inventory-service: { condition: service_started }
      fulfillment-service: { condition: service_started }

  web-admin:
    build: { context: ., dockerfile: web-admin/Dockerfile }
    ports: ["5173:80"]
    depends_on:
      gateway-service: { condition: service_started }

  prometheus:
    image: prom/prometheus:v3.7.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on:
      gateway-service: { condition: service_started }

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: autoflow123
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on:
      prometheus: { condition: service_started }

volumes:
  mysql-data:
  redis-data:
  grafana-data:
